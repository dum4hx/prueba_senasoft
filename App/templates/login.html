{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-cyan-700">Bienvenido</h1>
            <p class="text-gray-500 text-sm mt-2">Inicia sesión para continuar</p>
        </div>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="p-3 rounded-md text-sm 
                {% if message.tags == 'error' %} bg-red-100 text-red-700
                {% elif message.tags == 'success' %} bg-green-100 text-green-700
                {% else %} bg-gray-100 text-gray-700 {% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label for="identificador" class="block text-sm font-semibold text-gray-700 mb-1">
                    Número de Identificación
                </label>
                <input type="text" name="identificador" id="identificador" 
                    placeholder="Ingresa tu usuario o número"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-700 focus:outline-none">
            </div>

            <div>
                <label for="contraseña" class="block text-sm font-semibold text-gray-700 mb-1">
                    Contraseña
                </label>
                <input type="password" name="contraseña" id="contraseña" 
                    placeholder="Ingresa tu contraseña"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-700 focus:outline-none">
            </div>

            <button type="submit" 
                class="w-full bg-cyan-700 hover:bg-cyan-800 text-white font-semibold py-2 rounded-lg transition-all duration-200">
                Iniciar Sesión
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-sm text-gray-500">
                ¿No tienes una cuenta?
                <a href="{% url 'registro' %}" class="text-cyan-700 font-semibold hover:underline">
                    Regístrate aquí
                </a>
            </p>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        // Selecciona todos los mensajes de alerta
        const alerts = document.querySelectorAll(".alert-message");
    
        alerts.forEach(alert => {
            // Oculta la alerta después de 5 segundos (5000 ms)
            setTimeout(() => {
                alert.classList.add("opacity-0", "transition-opacity", "duration-500");
                setTimeout(() => alert.remove(), 500); // Remueve el elemento después de la transición
            }, 4000);
        });
    });
</script>

</body>
</html>
